
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRAVEL.ECO - Đăng nhập</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(120deg, #f9e8e0, #fff 60%, #f7d3c2);
}

/* TRANG ĐĂNG NHẬP */

.login-page {
    min-height: 100vh;
    display: flex;
    padding: 32px;
    gap: 7%;
    align-items: center;
}

.left-image {
    width: 53%;
    height: 92vh;
    border-radius: 30px;
    background:
    linear-gradient(to top, #f87939 10%, transparent 75%),
    url("https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1200")
    center/cover;
    position: relative;
    overflow: hidden;
}

.logo-left {
    color: #ff783b;
    font-size: 22px;
    font-weight: bold;
    padding: 60px;
}

.login-content {
    width: 40%;
    max-width: 500px;
    margin: auto;
}

.heading {
    text-align: center;
    margin-bottom: 55px;
}

.heading h1 {
    color: #fb7839;
    font-size: 48px;
    margin-bottom: 12px;
}

.heading p {
    font-size: 25px;
}

.form-group {
    margin-bottom: 30px;
}

.form-group label {
    display: block;
    font-weight: bold;
    font-size: 19px;
    margin-bottom: 20px;
}

.required {
    color: #ff493c;
}

.form-group input {
    width: 100%;
    height: 57px;
    border: 1px solid #888;
    border-radius: 15px;
    padding: 0 20px;
    font-size: 15px;
    outline: none;
    background: transparent;
}

.form-group input:focus {
    border-color: #fb7839;
    box-shadow: 0 0 5px #fb783955;
}

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 55px;
}

.eye {
    position: absolute;
    right: 20px;
    top: 18px;
    cursor: pointer;
    font-size: 21px;
    color: #777;
}

.forgot {
    text-align: right;
    margin-top: -5px;
    margin-bottom: 30px;
}

.forgot a {
    color: #888;
    text-decoration: none;
    font-size: 14px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 40px;
}

.btn {
    border: none;
    background: #fb7839;
    color: white;
    padding: 17px 30px;
    border-radius: 15px;
    font-size: 15px;
    cursor: pointer;
    min-width: 158px;
    transition: .3s;
}

.btn:hover {
    background: #e95d25;
    transform: translateY(-2px);
}

.or {
    display: flex;
    align-items: center;
    gap: 15px;
    margin: 43px 0 30px;
    color: #888;
    justify-content: center;
}

.or::before,
.or::after {
    content: "";
    height: 1px;
    background: #aaa;
    flex: 1;
}

.google {
    display: block;
    margin: auto;
    width: 115px;
    height: 57px;
    border: 1px solid #888;
    border-radius: 15px;
    background: transparent;
    font-size: 32px;
    font-weight: bold;
    color: #4285f4;
    cursor: pointer;
}

/* TRANG ĐĂNG KÝ */

.register-page {
    min-height: 100vh;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 30px 15px;
}

.register-container {
    width: 100%;
    max-width: 620px;
    text-align: center;
}

.register-container h1 {
    color: #b74742;
    font-size: 55px;
    margin-bottom: 5px;
}

.register-container h2 {
    text-align: left;
    font-size: 34px;
    margin-bottom: 25px;
}

.register-container input {
    display: block;
    width: 100%;
    height: 67px;
    border: 1px solid #999;
    border-radius: 17px;
    padding: 0 23px;
    font-size: 18px;
    margin-bottom: 28px;
    outline: none;
    background: transparent;
}

.register-container input:focus {
    border-color: #b74742;
}

.register-submit {
    background: transparent;
    border: none;
    color: #b74742;
    font-size: 20px;
    cursor: pointer;
    margin: 15px 0;
}

.register-submit:hover {
    color: #f87939;
}

.back-login {
    font-size: 22px;
    margin: 10px 0 60px;
}

.back-login a {
    color: #b74742;
    text-decoration: none;
    cursor: pointer;
}

.footer {
    width: 100%;
    min-height: 110px;
    background: #b74742;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    color: white;
    font-size: 35px;
    font-weight: bold;
}

.logout {
    border: none;
    padding: 15px 25px;
    border-radius: 15px;
    font-size: 16px;
    cursor: pointer;
}

/* RESPONSIVE */

@media(max-width: 850px) {
    .login-page {
        padding: 20px;
    }

    .left-image {
        display: none;
    }

    .login-content {
        width: 100%;
        max-width: 500px;
    }

    .heading h1 {
        font-size: 38px;
    }

    .buttons {
        gap: 12px;
    }

    .btn {
        min-width: 0;
        padding: 15px 20px;
    }

    .register-container h1 {
        font-size: 42px;
    }

    .register-container h2 {
        font-size: 27px;
    }

    .register-container input {
        height: 60px;
    }

    .back-login {
        font-size: 17px;
    }

    .footer {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<!-- TRANG ĐĂNG NHẬP -->

<div class="login-page" id="loginPage">

    <div class="left-image">
        <div class="logo-left">⬡ TRAVEL.ECO</div>
    </div>

    <div class="login-content">

        <div class="heading">
            <h1>Du lịch toàn quốc</h1>
            <p>Trung tâm nhận thưởng</p>
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label>Số điện thoại hoặc email <span class="required">(*)</span></label>
                <input type="text" id="loginEmail"
                placeholder="Số điện thoại hoặc email" required>
            </div>

            <div class="form-group">
                <label>Mật khẩu <span class="required">(*)</span></label>
                <div class="password-box">
                    <input type="password" id="loginPassword"
                    placeholder="Nhập mật khẩu" required>
                    <span class="eye"
                    onclick="togglePassword('loginPassword')">👁</span>
                </div>
            </div>

            <div class="forgot">
                <a href="#" onclick="forgotPassword()">Forgot Password?</a>
            </div>

            <div class="buttons">
                <button type="button" class="btn"
                onclick="showRegister()">Đăng kí ngay</button>

                <button type="submit" class="btn">Đăng nhập</button>
            </div>

        </form>

        <div class="or">or continue with</div>

        <button class="google" onclick="googleLogin()">G</button>

    </div>
</div>


<!-- TRANG ĐĂNG KÝ -->

<div class="register-page" id="registerPage">

    <div class="register-container">

        <button class="google" onclick="googleLogin()">G</button>

        <h1>TRAVEL.ECO</h1>

        <h2>Đăng ký tài khoản</h2>

        <form id="registerForm">

            <input type="text" id="fullname"
            placeholder="Họ và tên" required>

            <input type="text" id="registerEmail"
            placeholder="Số điện thoại hoặc email" required>

            <input type="password" id="registerPassword"
            placeholder="Mật khẩu (ít nhất 6 ký tự)" minlength="6" required>

            <input type="password" id="confirmPassword"
            placeholder="Nhập lại mật khẩu" required>

            <button type="submit" class="register-submit">
                Tạo tài khoản
            </button>

        </form>

        <div class="back-login">
            Đã có tài khoản?
            <a onclick="showLogin()">Đăng nhập ngay</a>
        </div>

        <div class="footer">
            TRAVEL.ECO
            <button class="logout" onclick="showLogin()">
                Đăng xuất
            </button>
        </div>

    </div>
</div>


<script>

// CHUYỂN SANG TRANG ĐĂNG KÝ

function showRegister() {
    document.getElementById("loginPage").style.display = "none";
    document.getElementById("registerPage").style.display = "flex";

    history.pushState({page: "register"}, "", "#register");
}

// CHUYỂN SANG TRANG ĐĂNG NHẬP

function showLogin() {
    document.getElementById("registerPage").style.display = "none";
    document.getElementById("loginPage").style.display = "flex";

    history.pushState({page: "login"}, "", "#login");
}

// BACK / FORWARD TRÌNH DUYỆT

window.addEventListener("popstate", function() {
    if (location.hash === "#register") {
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("registerPage").style.display = "flex";
    } else {
        document.getElementById("registerPage").style.display = "none";
        document.getElementById("loginPage").style.display = "flex";
    }
});

// HIỆN / ẨN MẬT KHẨU

function togglePassword(id) {
    let input = document.getElementById(id);

    input.type = input.type === "password"
        ? "text"
        : "password";
}

// ĐĂNG KÝ TÀI KHOẢN

document.getElementById("registerForm")
.addEventListener("submit", function(e) {

    e.preventDefault();

    let name = document.getElementById("fullname").value;
    let email = document.getElementById("registerEmail").value;
    let password = document.getElementById("registerPassword").value;
    let confirm = document.getElementById("confirmPassword").value;

    if (password.length < 6) {
        alert("Mật khẩu phải có ít nhất 6 ký tự!");
        return;
    }

    if (password !== confirm) {
        alert("Mật khẩu nhập lại không khớp!");
        return;
    }

    // Lưu demo trên trình duyệt
    localStorage.setItem("travelName", name);
    localStorage.setItem("travelEmail", email);
    localStorage.setItem("travelPassword", password);

    alert("Đăng ký thành công!");

    showLogin();

});

// ĐĂNG NHẬP TÀI KHOẢN

document.getElementById("loginForm")
.addEventListener("submit", function(e) {

    e.preventDefault();

    let email = document.getElementById("loginEmail").value;
    let password = document.getElementById("loginPassword").value;

    let savedEmail = localStorage.getItem("travelEmail");
    let savedPassword = localStorage.getItem("travelPassword");

    if (email === savedEmail && password === savedPassword) {
        alert("Đăng nhập thành công! Xin chào " +
        localStorage.getItem("travelName"));
    } else {
        alert("Tài khoản hoặc mật khẩu không chính xác!");
    }

});

// QUÊN MẬT KHẨU

function forgotPassword() {
    alert("Vui lòng liên hệ quản trị viên để lấy lại mật khẩu!");
}

// GOOGLE DEMO

function googleLogin() {
    alert("Chức năng đăng nhập Google cần tích hợp Google OAuth.");
}

// KIỂM TRA TRANG KHI TẢI

if (location.hash === "#register") {
    document.getElementById("loginPage").style.display = "none";
    document.getElementById("registerPage").style.display = "flex";
}

</script>

</body>
</html>
